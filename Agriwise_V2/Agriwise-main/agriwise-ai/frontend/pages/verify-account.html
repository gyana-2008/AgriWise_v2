<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Verify Mobile OTP — AGRIWISE AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="background: radial-gradient(circle at 50% 20%, #ecfdf5 0%, #f8fafc 80%);">

  <main class="page-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 2.5rem; text-align: center; box-shadow: var(--shadow-xl);">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📱</div>
        <h2 style="font-size: 1.6rem; color: var(--primary-900); margin-bottom: 0.5rem;">Verify Mobile Number</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.5rem;">
          Enter the 4-digit verification OTP code sent to your registered mobile device.
        </p>

        <form onsubmit="handleVerifyOtp(event)">
          <div style="display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem;">
            <input type="text" maxlength="1" class="form-control" style="width: 54px; height: 58px; text-align: center; font-size: 1.5rem; font-weight: 800;" value="1" required>
            <input type="text" maxlength="1" class="form-control" style="width: 54px; height: 58px; text-align: center; font-size: 1.5rem; font-weight: 800;" value="2" required>
            <input type="text" maxlength="1" class="form-control" style="width: 54px; height: 58px; text-align: center; font-size: 1.5rem; font-weight: 800;" value="3" required>
            <input type="text" maxlength="1" class="form-control" style="width: 54px; height: 58px; text-align: center; font-size: 1.5rem; font-weight: 800;" value="4" required>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            <span>Verify & Enter Dashboard</span>
          </button>
        </form>

        <div style="margin-top: 1.25rem; font-size: 0.84rem; color: var(--text-muted);">
          Didn't receive SMS? <a href="#" onclick="alert('New OTP code 1234 resent.')">Resend Code</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/navigation.js"></script>
  <script>
    function handleVerifyOtp(e) {
      e.preventDefault();
      alert("✅ Account Verified! Welcome to AgriWise AI.");
      window.location.href = "/dashboard";
    }
  </script>
</body>
</html>
