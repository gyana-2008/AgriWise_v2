<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔑 Reset Password — AGRIWISE AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="background: radial-gradient(circle at 50% 20%, #ecfdf5 0%, #f8fafc 80%);">

  <main class="page-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 2.5rem; text-align: center; box-shadow: var(--shadow-xl);">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔑</div>
        <h2 style="font-size: 1.6rem; color: var(--primary-900); margin-bottom: 0.5rem;">Reset Account Password</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.5rem;">
          Enter your registered mobile number or email address to receive password recovery instructions.
        </p>

        <form onsubmit="handleForgot(event)">
          <div class="form-group" style="text-align: left;">
            <label class="form-label">Registered Mobile or Email</label>
            <input type="text" id="resetContact" class="form-control" placeholder="+91 98765 43210" required>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            <span>Send Reset Instructions</span>
          </button>
        </form>

        <div style="margin-top: 1.5rem; font-size: 0.88rem;">
          <a href="/login">← Back to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/navigation.js"></script>
  <script>
    function handleForgot(e) {
      e.preventDefault();
      alert("Password reset instructions dispatched via SMS. Check your phone.");
      window.location.href = "/login";
    }
  </script>
</body>
</html>
