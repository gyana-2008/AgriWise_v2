<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔔 Agricultural Notifications & Alerts — AGRIWISE AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <main class="page-wrapper">
    <div class="container" style="max-width: 900px;">
      <!-- Title Section -->
      <div class="page-title-bar">
        <div class="page-title-left">
          <h1>🔔 Farm Alerts & Intelligence Notifications</h1>
          <p>Real-time severe weather warnings, Mandi price surges, nutrient stage milestones, and order dispatches.</p>
        </div>
        <div class="page-title-actions">
          <button class="btn btn-secondary btn-sm" onclick="markAllRead()">Mark All Read</button>
        </div>
      </div>

      <!-- Notification List -->
      <div class="card">
        <div style="display: flex; flex-direction: column; gap: 1rem;" id="notifListContainer">
          <!-- Dynamically populated from /api/notifications -->
        </div>
      </div>
    </div>
  </main>

  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadNotifications);

    async function loadNotifications() {
      try {
        const notifs = await AgriAPI.getNotifications();
        const container = document.getElementById('notifListContainer');
        if (notifs && notifs.length > 0) {
          container.innerHTML = notifs.map(n => `
            <div style="display: flex; align-items: flex-start; gap: 1.25rem; padding: 1.25rem; background: ${n.severity === 'WARNING' ? '#fffbeb' : (n.severity === 'SUCCESS' ? '#f0fdf4' : '#f8fafc')}; border-left: 4px solid ${n.severity === 'WARNING' ? '#d97706' : (n.severity === 'SUCCESS' ? '#059669' : '#0284c7')}; border-radius: 0 8px 8px 0;">
              <div style="font-size: 1.8rem; line-height: 1;">
                ${n.category === 'WEATHER' ? '🌧' : (n.category === 'MARKET' ? '📈' : (n.category === 'ORDER' ? '✅' : '🌱'))}
              </div>
              <div style="flex: 1;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                  <span class="badge ${n.severity === 'WARNING' ? 'badge-amber' : (n.severity === 'SUCCESS' ? 'badge-emerald' : 'badge-blue')}">${n.category}</span>
                  <span style="font-size: 0.78rem; color: var(--text-muted);">${n.created_at}</span>
                </div>
                <h4 style="font-size: 1.05rem; color: var(--text-main); margin: 4px 0;">${n.title}</h4>
                <p style="font-size: 0.88rem; color: #334155; margin-bottom: 0;">${n.message}</p>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.warn("Using offline notifications fallback", e);
      }
    }

    function markAllRead() {
      document.querySelectorAll('.notif-badge-count').forEach(el => el.style.display = 'none');
      alert("All notifications marked as read.");
    }
  </script>
</body>
</html>
